# Railway production service for NET360 API only
# Frontend (Vite) is hosted on Vercel — do not run vite on Railway.

[build]
builder = "RAILPACK"
# Never invoke vite. Safe even if dashboard still sets Build Command to npm run build
# because package.json "build" → scripts/build-for-host.mjs skips when vite is absent.
buildCommand = "node scripts/build-for-host.mjs"

[deploy]
startCommand = "node server/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
