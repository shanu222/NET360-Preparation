# Railway production service for NET360 API
# Custom domain: api.net360preparation.com (DNS CNAME → Railway)

[build]
builder = "NIXPACKS"

[deploy]
# Must be the Express API — not server/web.js (SPA helper).
startCommand = "node server/index.js"
# Liveness only: must return 200 while Mongo/Redis are still connecting.
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
