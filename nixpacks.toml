# API-only Railway image (NIXPACKS). Frontend Vite build is on Vercel.

[variables]
NIXPACKS_NODE_VERSION = "20"
# Ensures npm run build / build-for-host.mjs skips vite even if detection misses.
SKIP_VITE_BUILD = "1"

[phases.install]
cmds = ["npm ci --omit=dev || npm install --omit=dev"]

[phases.build]
cmds = ["node scripts/build-for-host.mjs"]

[start]
cmd = "node server/index.js"
