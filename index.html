
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
      <link rel="preload" href="/net360-logo.png" as="image" type="image/png" fetchpriority="high" />
      <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <!-- Google Fonts CSS is not pinned with SRI: the stylesheet response can vary (UA/capabilities), so a fixed hash would break. -->
      <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'"
      />
      <noscript>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
        />
      </noscript>
      <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
      <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
      <link rel="mask-icon" href="/net360-logo.png" color="#5f4ee6" />
      <link rel="manifest" href="/site.webmanifest" />
      <meta name="theme-color" content="#5f4ee6" />
      <meta property="og:site_name" content="NET360 Preparation" />
      <meta property="og:image" content="https://net360preparation.com/net360-logo.png" />
      <meta property="og:image:alt" content="NET360 Preparation" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:image" content="https://net360preparation.com/net360-logo.png" />
      <link rel="canonical" href="https://net360preparation.com/" />
      <meta property="og:url" content="https://net360preparation.com/" />
      <title>NET Preparation Pakistan | NUST Entry Test MCQs</title>
      <meta
        name="description"
        content="Prepare for NUST NET with MCQs, mock tests, AI study support, and analytics."
      />
      <meta
        name="keywords"
        content="NET preparation, NUST entry test, MCQs Pakistan, Physics MCQs"
      />
      <meta name="robots" content="index, follow" />
      <style>
        html,
        body,
        #root {
          min-height: 100%;
          min-height: 100dvh;
          width: 100%;
          max-width: 100%;
        }
        html,
        body {
          overflow-x: hidden;
        }
        #root {
          display: flex;
          flex-direction: column;
          overflow-x: hidden;
        }
        html {
          background-color: #f4f6fb;
        }
        body {
          margin: 0;
          background-color: #f4f6fb;
        }
        html.dark,
        html.dark body {
          background-color: #0f172a;
        }
        #net360-boot {
          position: fixed;
          inset: 0;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          margin: 0;
          background: #f4f6fb;
          color: #1e1b4b;
          font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        }
        html.dark #net360-boot {
          background: #0f172a;
          color: #f8fafc;
        }
        #net360-boot img {
          width: 88px;
          height: 88px;
          border-radius: 22px;
        }
        #net360-boot p {
          margin: 0;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: -0.03em;
        }
        #net360-boot span {
          color: #64748b;
          font-size: 13px;
          font-weight: 600;
        }
        html.dark #net360-boot span {
          color: #cbd5e1;
        }
      </style>
      <script>
        (function () {
          try {
            var saved = localStorage.getItem('net360-theme-mode');
            var dark = saved !== 'light';
            if (dark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f4f6fb');
          } catch (e) {}
        })();
      </script>
      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "EducationalApplication",
          "name": "NET360 Preparation",
          "description": "Platform for NET preparation with MCQs and mock tests",
          "image": "https://net360preparation.com/net360-logo.png"
        }
      </script>
    </head>

    <body>
      <div id="root">
        <div id="net360-boot" role="status" aria-live="polite" aria-busy="true">
          <img src="/net360-logo.png" alt="" width="88" height="88" />
          <p>NET360</p>
          <span>NUST entry test preparation</span>
        </div>
      </div>
      <script
        id="MathJax-script"
        async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
        integrity="sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei"
        crossorigin="anonymous"
      ></script>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
