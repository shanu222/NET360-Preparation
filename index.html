
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
      <meta name="mobile-web-app-capable" content="yes" />

        rel="preload"

        />
      </noscript>
      <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
      <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

      <link rel="manifest" href="/site.webmanifest" />

      <meta property="og:image" content="https://net360preparation.com/net360-logo.png" />
      <meta property="og:image:alt" content="NET360 Preparation" />

      <meta name="twitter:image" content="https://net360preparation.com/net360-logo.png" />
      <link rel="canonical" href="https://net360preparation.com/" />
      <meta property="og:url" content="https://net360preparation.com/" />
      <title>NET Preparation Pakistan | NUST Entry Test MCQs</title>
      <meta
        name="description"
        content="Prepare for NUST NET with MCQs, mock tests, AI study support, and analytics."
      />
      <meta
        name="keywords"
        content="NET preparation, NUST entry test, MCQs Pakistan, Physics MCQs"
      />
      <meta name="robots" content="index, follow" />
      <style>
        html,
        body,
        #root {
          min-height: 100%;
          min-height: 100dvh;
          width: 100%;
          max-width: 100%;
        }
        html,
        body {
          overflow-x: hidden;
        }
        #root {
          display: flex;
          flex-direction: column;
          overflow-x: hidden;
        }
        html {
          background-color: #f4f6fb;
        }
        body {
          margin: 0;
          background-color: #f4f6fb;
        }
        html.dark,
        html.dark body {
          background-color: #0f172a;
        }
        #net360-boot {
          position: fixed;
          inset: 0;
          z-index: 1;
          margin: 0;
        }
        html.native-runtime #net360-boot {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: #f4f6fb;
          color: #1e1b4b;
          font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        }
        html.dark.native-runtime #net360-boot {
          background: #0f172a;
          color: #f8fafc;
        }
        html.native-runtime #net360-boot img {
          width: 88px;
          height: 88px;
          border-radius: 22px;
        }
        html.native-runtime #net360-boot p {
          margin: 0;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: -0.03em;
        }
        html.native-runtime #net360-boot span {
          color: #64748b;
          font-size: 13px;
          font-weight: 600;
        }
        html.dark.native-runtime #net360-boot span {
          color: #cbd5e1;
        }
        html.native-runtime #net360-boot .net360-startup-web,
        html:not(.native-runtime) #net360-boot .net360-startup-native {
          display: none;
        }
        .net360-startup-web {
          position: relative;
          box-sizing: border-box;
          min-height: 100dvh;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background:
            radial-gradient(ellipse 90% 60% at 50% 38%, #e7ecff 0%, rgba(244, 246, 251, 0) 58%),
            #f4f6fb;
          color: #1e1b4b;
          font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        }
        #net360-boot .net360-startup-web {
          position: absolute;
          inset: 0;
          min-height: 100%;
        }
        html.dark .net360-startup-web {
          background:
            radial-gradient(ellipse 80% 55% at 50% 36%, rgba(79, 70, 229, 0.28) 0%, rgba(7, 11, 20, 0) 62%),
            #070b14;
          color: #f8fafc;
        }
        .net360-startup-bg {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        .net360-startup-orb {
          position: absolute;
          border-radius: 999px;
          filter: blur(28px);
          opacity: 0.55;
        }
        .net360-startup-orb-a {
          width: 220px;
          height: 220px;
          left: 12%;
          top: 22%;
          background: rgba(99, 102, 241, 0.28);
          animation: net360-startup-drift 16s ease-in-out infinite;
        }
        .net360-startup-orb-b {
          width: 180px;
          height: 180px;
          right: 10%;
          bottom: 18%;
          background: rgba(139, 92, 246, 0.22);
          animation: net360-startup-drift 18s ease-in-out infinite reverse;
        }
        .net360-startup-card {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 24px;
        }
        .net360-startup-mark {
          position: relative;
          width: 112px;
          height: 112px;
          display: grid;
          place-items: center;
          margin-bottom: 18px;
        }
        .net360-startup-ring,
        .net360-startup-glow {
          position: absolute;
          inset: 0;
          border-radius: 999px;
        }
        .net360-startup-ring {
          background: conic-gradient(from 0deg, transparent 0 68%, #6366f1 82%, #a78bfa 100%);
          -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
          animation: net360-startup-spin 2.8s linear infinite;
        }
        .net360-startup-glow {
          inset: 16px;
          background: rgba(99, 102, 241, 0.35);
          filter: blur(16px);
          animation: net360-startup-pulse 2.6s ease-in-out infinite;
        }
        .net360-startup-web img {
          position: relative;
          z-index: 1;
          width: 88px;
          height: 88px;
          border-radius: 22px;
          object-fit: cover;
          box-shadow: 0 10px 30px rgba(49, 46, 129, 0.18);
        }
        .net360-startup-brand,
        .net360-startup-tagline,
        .net360-startup-message,
        .net360-startup-detail {
          margin: 0;
        }
        .net360-startup-brand {
          font-size: 28px;
          font-weight: 700;
          letter-spacing: -0.04em;
        }
        .net360-startup-tagline {
          margin-top: 6px;
          font-size: 14px;
          font-weight: 600;
          color: #4338ca;
        }
        html.dark .net360-startup-tagline {
          color: #c7d2fe;
        }
        .net360-startup-message {
          margin-top: 22px;
          font-size: 15px;
          font-weight: 600;
        }
        .net360-startup-detail {
          margin-top: 6px;
          font-size: 13px;
          font-weight: 500;
          color: #64748b;
        }
        html.dark .net360-startup-detail {
          color: #94a3b8;
        }
        .net360-startup-bar {
          width: 168px;
          height: 3px;
          margin-top: 18px;
          overflow: hidden;
          border-radius: 999px;
          background: rgba(99, 102, 241, 0.16);
        }
        .net360-startup-bar span {
          display: block;
          width: 42%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(90deg, transparent, #6366f1, #a78bfa, transparent);
          animation: net360-startup-shimmer 1.5s ease-in-out infinite;
        }
        .net360-startup-dots {
          display: flex;
          gap: 6px;
          margin-top: 14px;
        }
        .net360-startup-dots i {
          display: block;
          width: 6px;
          height: 6px;
          border-radius: 999px;
          background: #6366f1;
          animation: net360-startup-dot 1.2s ease-in-out infinite;
        }
        .net360-startup-dots i:nth-child(2) { animation-delay: 0.15s; }
        .net360-startup-dots i:nth-child(3) { animation-delay: 0.3s; }
        @keyframes net360-startup-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes net360-startup-pulse {
          0%, 100% { opacity: 0.35; transform: scale(0.92); }
          50% { opacity: 0.85; transform: scale(1); }
        }
        @keyframes net360-startup-drift {
          0%, 100% { transform: translate3d(0, 0, 0); }
          50% { transform: translate3d(18px, -14px, 0); }
        }
        @keyframes net360-startup-shimmer {
          0% { transform: translateX(-120%); }
          100% { transform: translateX(280%); }
        }
        @keyframes net360-startup-dot {
          0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
          40% { opacity: 1; transform: translateY(-3px); }
        }
        @media (prefers-reduced-motion: reduce) {
          .net360-startup-ring,
          .net360-startup-glow,
          .net360-startup-orb,
          .net360-startup-bar span,
          .net360-startup-dots i {
            animation: none;
          }
        }
      </style>
      <script>
        (function () {
          try {
            var nativeBridge = window.Capacitor;
            if (nativeBridge && typeof nativeBridge.isNativePlatform === 'function' && nativeBridge.isNativePlatform()) {
              document.documentElement.classList.add('native-runtime');
            }
          } catch (nativeBootErr) {}
          try {
            var saved = localStorage.getItem('net360-theme-mode');
            var dark = saved !== 'light';
            if (dark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f4f6fb');
          } catch (e) {}
        })();
      </script>
      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "EducationalApplication",
          "name": "NET360 Preparation",
          "description": "Platform for NET preparation with MCQs and mock tests",
          "image": "https://net360preparation.com/net360-logo.png"
        }
      </script>
    </head>

    <body>
      <div id="root">
        <div id="net360-boot">
          <div class="net360-startup-web" role="status" aria-live="polite" aria-busy="true">
            <div class="net360-startup-bg" aria-hidden="true">
              <span class="net360-startup-orb net360-startup-orb-a"></span>
              <span class="net360-startup-orb net360-startup-orb-b"></span>
            </div>
            <div class="net360-startup-card">
              <div class="net360-startup-mark">
                <span class="net360-startup-glow" aria-hidden="true"></span>
                <span class="net360-startup-ring" aria-hidden="true"></span>
                <img src="/net360-logo.png" alt="" width="88" height="88" />
              </div>
              <p class="net360-startup-brand">NET360</p>
              <p class="net360-startup-tagline">NUST Entry Test Preparation</p>
              <p class="net360-startup-message">Preparing your NET360 experience</p>
              <p class="net360-startup-detail">Loading your NUST preparation platform...</p>
              <div class="net360-startup-bar" aria-hidden="true"><span></span></div>
              <div class="net360-startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
            </div>
          </div>
          <div class="net360-startup-native" role="status" aria-live="polite" aria-busy="true">
            <img src="/net360-logo.png" alt="" width="88" height="88" />
            <p>NET360</p>
            <span>NUST entry test preparation</span>
          </div>
        </div>
      </div>

        id="MathJax-script"
        async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"

        crossorigin="anonymous"
      ></script>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
